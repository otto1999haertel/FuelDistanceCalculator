name: Nightly Deployment

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build
        run: |
          docker build -t ghcr.io/otto1999haertel/fueldistancecalculator:latest .
          docker tag ghcr.io/otto1999haertel/fueldistancecalculator:latest \
                     ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }}

      - name: Push
        run: |
          docker push ghcr.io/otto1999haertel/fueldistancecalculator:latest
          docker push ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }}

  deploy:
    needs: [test, docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/${{ secrets.SSH_USER }}/fuelgo

          docker compose --env-file .env.server pull fuelgo-webapp
          docker compose --env-file .env.server up -d --no-deps fuelgo-webapp
          EOF