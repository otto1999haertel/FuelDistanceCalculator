name: CI + Nightly Deploy

on:
  push:
    branches: ["master"]

  pull_request:

  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

# -------------------------
# TESTS (immer)
# -------------------------
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release

# -------------------------
# BUILD + PUSH (nur bei Master Push ODER Nightly ODER Manual)
# -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/otto1999haertel/fueldistancecalculator:${GITHUB_SHA} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/otto1999haertel/fueldistancecalculator:${GITHUB_SHA}

# -------------------------
# DEPLOY (nur Nightly + Manual)
# -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -e

          cd /home/${{ secrets.SSH_USER }}/fuelgo

          IMAGE_TAG=${{ needs.build.outputs.image_tag }}

          echo "Deploying image: $IMAGE_TAG"

          docker pull ghcr.io/otto1999haertel/fueldistancecalculator:$IMAGE_TAG

          IMAGE_TAG=$IMAGE_TAG docker compose --env-file .env.server up -d --no-deps --force-recreate fuelgo-webapp

          EOF