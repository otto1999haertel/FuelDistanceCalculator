name: CI + Build + Nightly Deploy

on:
  push:
    branches: ["master"]

  pull_request:

  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

# -------------------------
# 1. TESTS (immer)
# -------------------------
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release

# -------------------------
# 2. DOCKER BUILD + PUSH (nur master Push)
# -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    # nur echte Änderungen auf master (kein PR, kein nightly)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build & Push Docker Image
        run: |
          docker build -t ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }} .
          docker push ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }}

# -------------------------
# 3. DEPLOY (nur Nightly + Manual)
# -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    # nur Nightly oder manuell
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -e

          cd /home/${{ secrets.SSH_USER }}/fuelgo

          IMAGE_TAG=${{ github.sha }}

          echo "Deploying: $IMAGE_TAG"

          docker pull ghcr.io/otto1999haertel/fueldistancecalculator:$IMAGE_TAG

          IMAGE_TAG=$IMAGE_TAG docker compose --env-file .env.server up -d --no-deps fuelgo-webapp
          EOF