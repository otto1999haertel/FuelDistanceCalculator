name: Nightly Deployment

on:
  schedule:
    # Cron: Jeden Tag um 2:00 Uhr UTC (3:00 Uhr MEZ / 2:00 Uhr CET im Winter)
    # Für 2:00 Uhr lokale Zeit Deutschland (CET): 1:00 UTC
    - cron: '0 1 * * *'
  
  # Optional: Manueller Trigger für Tests
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # Immer die neueste Version vom master
      - run: dotnet build --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      ApiSettings__TankApiKey: ${{ secrets.TANKAPIKEY }}
      ApiSettings__OpenRouteServiceApiKey: ${{ secrets.OPENROUTESERVICEAPIKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: dotnet test --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ needs.test.result == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync source to server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/fuelgo
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Create .env.server with API keys
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENVSSH'
              cd /home/${{ secrets.SSH_USER }}/fuelgo
              
              cat > .env.server << 'EOF'
          CERT_CRT_PATH=/etc/letsencrypt/live/fuelgo.de/fullchain.pem
          CERT_KEY_PATH=/etc/letsencrypt/live/fuelgo.de/privkey.pem
          SERVER_NAME=fuelgo.de www.fuelgo.de
          MODE_TYPE=Production
          REDIS_HOST=redis:6379
          TANK_API_KEY=${{ secrets.TANKAPIKEY }}
          OPENROUTESERVICE_API_KEY=${{ secrets.OPENROUTESERVICEAPIKEY }}
          EOF
              
              chmod 600 .env.server
          ENVSSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
      
      - name: Deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
              if sudo systemctl is-active --quiet nginx; then
                echo "Stopping native Nginx service"
                sudo systemctl stop nginx
              fi

              cd /home/${{ secrets.SSH_USER }}/fuelgo
              sudo docker compose down
              sudo docker compose --env-file .env.server up --build -d
              
              echo "✓ Deployment completed successfully at $(date)"
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✓ Nightly deployment successful"
          else
            echo "✗ Nightly deployment failed - tests did not pass"
            exit 1
          fi