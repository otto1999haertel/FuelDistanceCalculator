name: Nightly Deployment

on:
  schedule:
    - cron: '0 0 * * *'   # nightly: deploys only if there was a commit in the last 24h
    - cron: '0 2 * * 3'   # weekly patch run (Wednesday, day after Patch Tuesday): always rebuilds fresh
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force deploy with fresh pull and --no-cache build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check_adac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check ADAC data freshness
        run: |
          JSON_PATH="FuelDistanceCalculator/Data/ADAC_car_data.json"

          if [ ! -f "$JSON_PATH" ]; then
            echo "::warning::ADAC data file not found at $JSON_PATH"
            exit 0
          fi

          AGE_DAYS=$(python3 .github/scripts/check_adac.py "$JSON_PATH")

          echo "Data age: $AGE_DAYS days"

          if [ "$AGE_DAYS" -eq -1 ]; then
            echo "::warning::ADAC data has no metadata - regenerate JSON with updated Python script"
            exit 0
          fi

          if [ "$AGE_DAYS" -gt 180 ]; then
            echo "::warning::ADAC data is $AGE_DAYS days old - consider updating the PDF"
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              exit 1
            fi
          fi

  check_changes:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      fresh: ${{ steps.check.outputs.fresh }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether to deploy
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          FRESH=false
          if [ "$EVENT" = "schedule" ] && [ "$CRON" = "0 5 * * 3" ]; then
            FRESH=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            FRESH=true
          fi
          echo "fresh=$FRESH" >> $GITHUB_OUTPUT

          if [ "$FRESH" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✓ Patch run / forced rebuild: deploying with fresh pull and --no-cache"
            exit 0
          fi

          LAST_COMMIT=$(git log -1 --format=%ct)
          LAST_COMMIT_INFO=$(git log -1 --pretty=format:"%h - %s (%an, %ar)")
          echo "Last commit: $LAST_COMMIT_INFO"
          CURRENT_TIME=$(date +%s)
          TIME_DIFF=$((CURRENT_TIME - LAST_COMMIT))

          if [ $TIME_DIFF -lt 86400 ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✓ Neue Commits gefunden (vor $((TIME_DIFF / 3600)) Stunden)"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "✗ Keine neuen Commits in den letzten 24h"
          fi

  # Alerts you (failed run = email) when a NuGet package has a known vulnerability.
  # Deliberately NOT a dependency of deploy, so a new advisory never blocks unrelated deploys.
  vuln_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Scan NuGet packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages found - see log"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release

  deploy:
    needs: [test, check_changes]
    runs-on: ubuntu-latest
    if: needs.test.result == 'success' && needs.check_changes.outputs.should_deploy == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync source to server
        run: |
          rsync -avz --delete \
            --exclude '.env*' \
            --exclude '.git' \
            -e "ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/fuelgo
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Create .env.server with API keys
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /home/${{ secrets.SSH_USER }}/fuelgo && cat > .env.server << 'EOF'
          CERT_CRT_PATH=/etc/letsencrypt/live/fuelgo.de/fullchain.pem
          CERT_KEY_PATH=/etc/letsencrypt/live/fuelgo.de/privkey.pem
          SERVER_NAME=fuelgo.de www.fuelgo.de
          MODE_TYPE=Production
          REDIS_HOST=redis:6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          TANK_API_KEY=${{ secrets.TANKAPIKEY }}
          OPENROUTESERVICE_API_KEY=${{ secrets.OPENROUTESERVICEAPIKEY }}
          EOF
          "

      - name: Verify .env.server on server
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
              echo "=== .env.server key check ==="

              TANK_KEY=\$(grep -E "^TANK_API_KEY=" /home/${{ secrets.SSH_USER }}/fuelgo/.env.server | cut -d'=' -f2-)
              ORS_KEY=\$(grep -E "^OPENROUTESERVICE_API_KEY=" /home/${{ secrets.SSH_USER }}/fuelgo/.env.server | cut -d'=' -f2-)
              RDIS_KEY=\$(grep -E "^REDIS_PASSWORD=" /home/${{ secrets.SSH_USER }}/fuelgo/.env.server | cut -d'=' -f2-)

              if [ -z "\$TANK_KEY" ]; then
                echo "✗ TANK_API_KEY is missing!"
                exit 1
              else
                echo "✓ TANK_API_KEY present | length: \${#TANK_KEY}"
              fi

              if [ -z "\$ORS_KEY" ]; then
                echo "✗ OPENROUTESERVICE_API_KEY is missing!"
                exit 1
              else
                echo "✓ ORS_KEY present | length: \${#ORS_KEY}"
              fi

              if [ -z "\$RDIS_KEY" ]; then
                echo "✗ REDIS_PASSWORD is missing!"
                exit 1
              else
                echo "✓ REDIS_PASSWORD present | length: \${#RDIS_KEY}"
              fi
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Deploy on remote server
        env:
          FRESH: ${{ needs.check_changes.outputs.fresh }}
        run: |
          # Always re-pull base images; skip the layer cache on patch runs so
          # apt packages and 'dotnet restore' are re-executed.
          BUILD_FLAGS="--pull"
          if [ "$FRESH" = "true" ]; then BUILD_FLAGS="--pull --no-cache"; fi

          # $BUILD_FLAGS is expanded here on the runner (unescaped on purpose)
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          set -e
          if sudo systemctl is-active --quiet nginx; then
            echo "Stopping native Nginx service"
            sudo systemctl stop nginx
          fi

          cd /home/${{ secrets.SSH_USER }}/fuelgo

          # Build first while the old web app container keeps serving ...
          sudo docker compose --env-file .env.server build $BUILD_FLAGS fuelgo-webapp

          # ... then stop ONLY the web app and start the new one.
          # nginx and redis are never stopped, recreated or pulled here.
          sudo docker compose --env-file .env.server down fuelgo-webapp
          sudo docker compose --env-file .env.server up -d --no-deps fuelgo-webapp

          # nginx resolves the 'fuelgo-webapp' upstream when it loads its config, so a
          # recreated container with a new IP could cause 502s. A reload is graceful
          # (no dropped connections); if it fails, the old config simply stays active.
          sudo docker exec fuelgo-nginx nginx -s reload || echo "nginx reload skipped"

          sudo docker image prune -f
          echo "✓ Deployment completed successfully at \$(date)"
          EOF

      - name: Smoke test
        run: |
          curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors https://fuelgo.de/
          echo "✓ fuelgo.de responds"

      - name: Deployment summary
        if: always()
        run: echo "Deployment finished with status ${{ job.status }}"