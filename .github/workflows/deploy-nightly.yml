name: Nightly Deploy

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changed
        uses: tj-actions/changed-files@v46

  test:
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --no-restore

  build_docker:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build & Push
        run: |
          docker build -t ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }} .
          docker push ghcr.io/otto1999haertel/fueldistancecalculator:${{ github.sha }}

  deploy:
    needs: build_docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload configs
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /home/$SSH_USER/fuelgo/nginx"
          scp -P "$SSH_PORT" docker-compose.yml "$SSH_USER@$SSH_HOST:/home/$SSH_USER/fuelgo/docker-compose.yml"
          scp -P "$SSH_PORT" nginx/default.conf "$SSH_USER@$SSH_HOST:/home/$SSH_USER/fuelgo/nginx/default.conf"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build_docker.outputs.image_tag }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            cd /home/$SSH_USER/fuelgo &&
            cat > .env.server << 'ENVEOF'
          IMAGE_TAG=$IMAGE_TAG
          MODE_TYPE=Production
          REDIS_HOST=redis
          TANK_API_KEY=$TANK_API_KEY
          OPENROUTESERVICE_API_KEY=$OPENROUTESERVICE_API_KEY
          ENVEOF
            docker pull ghcr.io/otto1999haertel/fueldistancecalculator:$IMAGE_TAG &&
            docker compose --env-file .env.server up -d --force-recreate fuelgo-webapp"