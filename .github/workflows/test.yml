name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  check_adac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check ADAC data freshness
        run: |
          JSON_PATH="FuelDistanceCalculator/Data/ADAC_car_data.json"

          if [ ! -f "$JSON_PATH" ]; then
            echo "::warning::ADAC data file not found at $JSON_PATH"
            exit 0
          fi

          AGE_DAYS=$(python3 .github/scripts/check_adac.py "$JSON_PATH")

          echo "Data age: $AGE_DAYS days"

          if [ "$AGE_DAYS" -eq -1 ]; then
            echo "::warning::ADAC data has no metadata - regenerate JSON with updated Python script"
            exit 0
          fi

          if [ "$AGE_DAYS" -gt 180 ]; then
            echo "::warning::ADAC data is $AGE_DAYS days old - consider updating the PDF"
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              exit 1
            fi
          fi

  validate_env:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          echo "Validating API keys..."

          for key in "${{ secrets.TANKAPIKEY }}" "${{ secrets.OPENROUTESERVICEAPIKEY }}"; do
            if echo "$key" | grep -Ei "fake|test|local|dev|dummy"; then
              echo "Invalid API key detected"
              exit 1
            fi
          done

          echo "API keys look valid"

  validate_ssh_key:
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH key format
        run: |
          echo "Checking SSH key format..."

          if [[ "${{ secrets.SSH_PRIVATE_KEY }}" == *"BEGIN"* ]]; then
            echo "✓ Key contains BEGIN marker"
          else
            echo "✗ Key missing BEGIN marker"
            exit 1
          fi

          if [[ "${{ secrets.SSH_PRIVATE_KEY }}" == *"PRIVATE KEY"* ]]; then
            echo "✓ Key looks valid"
          else
            echo "✗ Key format invalid"
            exit 1
          fi
  
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet build --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release