name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  check_adac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check ADAC data freshness
        run: |
          JSON_PATH="FuelDistanceCalculator/Data/ADAC_car_data.json"
          
          if [ ! -f "$JSON_PATH" ]; then
            echo "::warning::ADAC data file not found at $JSON_PATH"
            exit 0
          fi

          echo "JSON preview:"
          head -10 "$JSON_PATH"
          
          AGE_DAYS=$(python3 -c "
          import json
          from datetime import datetime
          with open('$JSON_PATH') as f:
              d = json.load(f)
          if 'metadata' not in d:
              print(-1)
          else:
              generated = datetime.fromisoformat(d['metadata']['generated_at'])
              age = (datetime.now() - generated).days
              print(age)
          ")
          
          echo "AGE_DAYS value: '$AGE_DAYS'"
          
          if [ "$AGE_DAYS" -eq -1 ]; then
            echo "::warning::ADAC data has no metadata - regenerate JSON with updated Python script"
            exit 0
          fi
          
          echo "Data age: $AGE_DAYS days"
          
          if [ "$AGE_DAYS" -gt 180 ]; then
            echo "::warning::ADAC data is $AGE_DAYS days old - consider updating the PDF"
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              exit 1
            fi
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: dotnet build --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release