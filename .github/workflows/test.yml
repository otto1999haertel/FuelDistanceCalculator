name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  check-data-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADAC data freshness
        run: |
          JSON_PATH="FuelDistanceCalculator/Data/ADAC_car_data.json"
          
          if [ ! -f "$JSON_PATH" ]; then
            echo "::warning::ADAC data file not found at $JSON_PATH"
            exit 0
          fi
          
          AGE_DAYS=$(python3 -c "
          import os
          from datetime import datetime
          mtime = os.path.getmtime('$JSON_PATH')
          age = (datetime.now() - datetime.fromtimestamp(mtime)).days
          print(age)
          ")
          
          echo "Data age: $AGE_DAYS days"
          
          if [ \"\$AGE_DAYS\" -gt 180 ]; then
            echo \"::warning::ADAC data is \$AGE_DAYS days old - consider updating the PDF\"
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: dotnet build --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
    steps:
      - uses: actions/checkout@v5
      - run: dotnet test --configuration Release