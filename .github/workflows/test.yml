name: Unit Integration Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  check_adac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check ADAC data freshness
        run: |
          JSON_PATH="FuelDistanceCalculator/Data/ADAC_car_data.json"

          if [ ! -f "$JSON_PATH" ]; then
            echo "::warning::ADAC data file not found at $JSON_PATH"
            exit 0
          fi

          AGE_DAYS=$(python3 .github/scripts/check_adac.py "$JSON_PATH")

          echo "Data age: $AGE_DAYS days"

          if [ "$AGE_DAYS" -eq -1 ]; then
            echo "::warning::ADAC data has no metadata - regenerate JSON with updated Python script"
            exit 0
          fi

          if [ "$AGE_DAYS" -gt 180 ]; then
            echo "::warning::ADAC data is $AGE_DAYS days old - consider updating the PDF"
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              exit 1
            fi
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: dotnet build --configuration Release

  
  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      TANK_API_KEY: ${{ secrets.TANKAPIKEY }}
      OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICEAPIKEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Run tests with coverage
        run: >
          dotnet test
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: always()
        run: |
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

      - name: Add coverage summary to GitHub Actions
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coveragereport/
          retention-days: 14
