services:

  redis:
    image: "redis:latest"
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fuel-network

  fuelgo-webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE_TYPE: ${MODE_TYPE}
    environment:
      - MODE_TYPE=${MODE_TYPE}
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=postgres;Password=example;Database=FuelDatabase
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ApiSettings__TankApiKey=${TANK_API_KEY}
      - ApiSettings__OpenRouteServiceApiKey=${OPENROUTESERVICE_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - fuel-network

  nginx:
    image: nginx:latest
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/:/etc/nginx/snippets/:ro
      - ${CERT_CRT_PATH}:/etc/nginx/certs/cert.crt:ro
      - ${CERT_KEY_PATH}:/etc/nginx/certs/cert.key:ro
      - ./nginx/offline:/var/www/html/offline:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      fuelgo-webapp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/443'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fuel-network

  e2e-test-client:
    build:
      context: ./FuelDistanceCalculatorE2ETest
      dockerfile: Dockerfile
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - BASE_URL=https://nginx
    volumes:
      - ./e2e-results:/tests/TestResults
    networks:
      - fuel-network

networks:
  fuel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  redis_data:
  dataprotection-keys: