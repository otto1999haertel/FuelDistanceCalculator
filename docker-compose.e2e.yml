version: '3.8'

services:

  redis:
    image: "redis:latest"
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fuel-network

  nginx:
    image: nginx:latest
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_CRT_PATH}:/etc/nginx/certs/cert.crt:ro
      - ${CERT_KEY_PATH}:/etc/nginx/certs/cert.key:ro
      - ./nginx/offline:/var/www/html/offline:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fuel-network

  fuelgo-webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODE_TYPE: ${MODE_TYPE}
    environment:
      - MODE_TYPE=${MODE_TYPE}
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=postgres;Password=example;Database=FuelDatabase
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ApiSettings__TankApiKey=${TANK_API_KEY}
      - ApiSettings__OpenRouteServiceApiKey=${OPENROUTESERVICE_API_KEY}
    networks:
      - fuel-network

  e2e-test-client:
    build:
      context: ./FuelDistanceCalculatorE2ETest
      dockerfile: Dockerfile
    depends_on:
      - nginx
    environment:
      - BASE_URL=https://nginx
    volumes:
      - ./e2e-results:/tests/TestResults
    networks:
      - fuel-network

networks:
  fuel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres-data:
  redis_data:
  dataprotection-keys: