version: '3.8'

services:
  redis:
    image: "redis:latest"
    container_name: "redis"
    restart: always
    #ports:
      #- "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fuel-network

  fuelgo-webapp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MODE_TYPE=${MODE_TYPE}
      - ASPNETCORE_ENVIRONMENT=${MODE_TYPE}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Username=postgres;Password=example;Database=FuelDatabase
      - REDIS_HOST=redis:6379
    depends_on:
      - db
    command: ["./start.sh"]  # Hier wird das Skript ausgeführt
    networks:
      - fuel-network
    deploy:
      resources:
        limits:
          cpus: '1.00'

  nginx:
    image: nginx:latest
    container_name: fuelgo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_CRT_PATH}:/etc/nginx/certs/cert.crt:ro
      - ${CERT_KEY_PATH}:/etc/nginx/certs/cert.key:ro
    depends_on:
      - fuelgo-webapp
    networks:
      fuel-network:
       ipv4_address: 172.19.0.5

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: FuelDatabase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    #ports:
      #- "5432:5432"  # Dies exponiert den Port 5432 für den Host
    networks:
      - fuel-network

networks:
  fuel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24

volumes:
  postgres-data:
  redis_data:
