services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  fuelgo-webapp:
    image: ghcr.io/otto1999haertel/fueldistancecalculator:${IMAGE_TAG:-latest}
    restart: always

    environment:
      MODE_TYPE: ${MODE_TYPE}
      ASPNETCORE_ENVIRONMENT: ${MODE_TYPE}
      REDIS_HOST: ${REDIS_HOST}
      TANK_API_KEY: ${TANK_API_KEY}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}

    volumes:
      - dataprotection-keys:/app/dataprotection-keys

    depends_on:
      - redis

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - fuelgo-webapp

volumes:
  redis_data:
  dataprotection-keys: