server {
    listen 80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # ✅ SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ✅ Server-Version verstecken
    server_tokens off;

    # ✅ Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # ✅ CSP - erst Report-Only zum Testen
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ✅ Gzip Komprimierung (schnellere Ladezeiten)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ✅ Statische Dateien mit korrektem Content-Type
    location = /sitemap.xml {
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        add_header Content-Type "application/xml; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        add_header Content-Type "text/plain; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /llms.txt {
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
        add_header Content-Type "text/plain; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Verhindert doppelten X-Frame-Options Header von der App
        proxy_hide_header X-Frame-Options;

        # ✅ Timeouts für Stabilität
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}