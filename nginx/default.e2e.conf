# Rate-Limit-Zonen (http-Kontext, da conf.d/*.conf dort eingebunden wird)
limit_req_zone  $binary_remote_addr zone=perip:10m rate=1000r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # ✅ SSL Hardening (Mozilla "intermediate")
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ✅ Server-Version verstecken
    server_tokens off;

    # ✅ Security Headers (werden in Locations mit eigenem add_header erneut eingebunden)
    include /etc/nginx/snippets/security-headers.conf;

    # ✅ Gzip Komprimierung
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ✅ Limits gegen Missbrauch / Slowloris
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    limit_conn connperip 30;
    limit_req_status 429;

    # ✅ Healthcheck nicht öffentlich erreichbar machen
    location = /healthz {
        return 404;
    }

    # ✅ Statische Dateien mit korrektem Content-Type
    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        add_header Content-Type "application/xml; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        add_header Content-Type "text/plain; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /llms.txt {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        add_header Content-Type "text/plain; charset=UTF-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        # Kein add_header in diesem Block, daher gelten die Security Headers vom Server-Level
        limit_req zone=perip burst=2000 nodelay;

        proxy_pass http://fuelgo-webapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Client-Wert nicht durchreichen, immer die echte Adresse setzen
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Verhindert doppelten X-Frame-Options Header von der App
        proxy_hide_header X-Frame-Options;

        # ✅ Timeouts für Stabilität
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ✅ Backend-Fehler an nginx übergeben statt an den Client
        proxy_intercept_errors on;
    }

    # ============================================================
    # ⚠️ OFFLINE FALLBACK, wenn fuelgo-webapp nicht erreichbar ist
    # ============================================================

    # Nur echte Upstream-Probleme
    error_page 502 503 504 = @backend_offline;

    location @backend_offline {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        root /var/www/html/offline;
        try_files /502-offline.html =502;
        add_header Cache-Control "no-store" always;
    }
}